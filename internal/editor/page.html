<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>docket editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #08090a;
      --side: #0f1011;
      --panel: #0f1011;
      --elev: #141516;
      --hover: #18191b;
      --active: #1c1c1f;
      --line: #232326;
      --text: #f7f8f8;
      --mute: #8a8f98;
      --faint: #62666d;
      --accent: #5e6ad2;
      --todo: #8a8f98;
      --progress: #f2c14e;
      --blocked: #eb5757;
      --done: #5e6ad2;
      --draft: #6b7180;
      --high: #eb5757;
      --medium: #f2c14e;
      --low: #8a8f98;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
    body {
      font-family: Inter, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }
    .app {
      display: grid;
      grid-template-columns: minmax(160px, 220px) minmax(0, 1fr) minmax(260px, 420px);
      height: 100%;
      min-height: 0;
    }
    .app.no-sheet, .app.is-board, .app.is-dag, .app.is-gantt, .app.is-qa, .app.is-json {
      grid-template-columns: minmax(160px, 220px) minmax(0, 1fr);
    }
    aside {
      display: flex;
      flex-direction: column;
      background: var(--side);
      border-right: 1px solid var(--line);
      padding: 14px 10px 12px;
      overflow: auto;
      min-height: 0;
    }
    .workspace {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 8px 14px;
    }
    .mark-team {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      background: linear-gradient(135deg, #5e6ad2, #8b93e8);
      flex: none;
    }
    .workspace h1 {
      margin: 0;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    .workspace small { display: block; color: var(--faint); font-size: 11px; font-weight: 400; }
    .new {
      width: 100%;
      height: 32px;
      margin: 0 0 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--elev);
      color: var(--text);
      font: inherit;
      font-weight: 500;
      cursor: pointer;
    }
    .new:hover { background: var(--active); }
    .nav-label {
      padding: 8px 8px 4px;
      color: var(--faint);
      font-size: 11px;
      font-weight: 500;
    }
    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 30px;
      padding: 0 8px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--mute);
      font: inherit;
      cursor: pointer;
    }
    .nav-item:hover { background: var(--hover); color: var(--text); }
    .nav-item.on { background: var(--active); color: var(--text); }
    .nav-item span { display: flex; align-items: center; gap: 8px; }
    .count { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 11px; }
    main { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; background: var(--panel); }
    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 10px;
      min-height: 44px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--line);
    }
    .toolbar h2 { margin: 0; font-size: 13px; font-weight: 500; }
    .views {
      display: flex;
      gap: 2px;
      margin-left: 8px;
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--bg);
    }
    .views button {
      width: 28px;
      height: 24px;
      padding: 0;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--faint);
      cursor: pointer;
    }
    .views button.on { background: var(--active); color: var(--text); }
    .views svg { display: block; margin: 5px auto; }
    .dag-play {
      width: 28px;
      height: 24px;
      margin-left: 6px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg);
      color: var(--faint);
      cursor: pointer;
    }
    .dag-play:hover { color: var(--text); }
    .dag-play.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .dag-play svg { display: block; margin: 4px auto; }
    .dag-play-meta {
      margin-left: 8px;
      color: var(--mute);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .poll {
      margin-left: auto;
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      flex: none;
    }
    .poll-pie {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: conic-gradient(from -90deg, var(--accent) var(--p, 100%), var(--line) 0);
    }
    .poll.is-hold .poll-pie {
      background: conic-gradient(from -90deg, var(--faint) var(--p, 100%), var(--line) 0);
    }
    .toolbar input {
      width: min(200px, 100%);
      min-width: 120px;
      flex: 1 1 140px;
      height: 28px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
    }
    .toolbar input:focus { outline: 1px solid #3d4260; }
    .list { overflow: auto; flex: 1; min-height: 0; }
    .list:has(.board) { overflow: hidden; display: flex; }
    .list:has(.dag-wrap), .list:has(.gantt-wrap), .list:has(.qa-wrap), .list:has(.json-wrap) { overflow: auto; display: block; }
    .stats {
      flex: none;
      padding: 12px 8px 4px;
      border-top: 1px solid var(--line);
    }
    .stats-types {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin-bottom: 8px;
    }
    .stats-type {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      padding: 3px 7px 3px 6px;
      border: 1px solid var(--line);
      border-left-width: 2px;
      border-radius: 6px;
      color: var(--mute);
      font-size: 11px;
    }
    .stats-type b {
      color: var(--text);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }
    .stats-type.tone-GOAL { border-left-color: var(--accent); }
    .stats-type.tone-PLAN { border-left-color: #8b93e8; }
    .stats-type.tone-TASK { border-left-color: var(--faint); }
    .stats-type.tone-GUARD { border-left-color: var(--blocked); }
    .stats-type.tone-TEST { border-left-color: var(--progress); }
    .stats-type.tone-VALIDATION { border-left-color: #3fa68a; }
    .stats-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      color: var(--faint);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .stats-row .bad { color: var(--blocked); }
    .stats-score {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin: 0 0 10px;
      color: var(--faint);
      font-variant-numeric: tabular-nums;
    }
    .stats-score b {
      color: var(--text);
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }
    .stats-score.ok b { color: #3fa68a; }
    .stats-score.mid b { color: var(--progress); }
    .stats-score.bad b { color: var(--blocked); }
    .stats-size {
      display: grid;
      gap: 3px;
      margin-bottom: 10px;
      color: var(--text);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .stats-size div {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      gap: 8px;
      align-items: baseline;
    }
    .stats-size span { color: var(--faint); }
    .stats-size b { font-weight: 600; }
    .stats-size em { color: var(--mute); font-style: normal; }
    .composer {
      display: none;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--elev);
    }
    .composer.open { display: flex; flex-direction: column; }
    .composer textarea {
      min-height: 48px;
      padding: 8px;
      border-color: var(--line);
      background: var(--bg);
      resize: vertical;
    }
    .composer textarea.brief { min-height: 80px; }
    .composer input, .prop select, .prop input, .notes, .title-edit, .blocked-edit {
      width: 100%;
      background: transparent;
      color: var(--text);
      border: 1px solid transparent;
      border-radius: 6px;
      font: inherit;
    }
    .composer input {
      height: 32px;
      padding: 0 8px;
      border-color: var(--line);
      background: var(--bg);
    }
    .row {
      display: grid;
      grid-template-columns: 16px 44px minmax(12rem, 1fr) 3.6rem auto 14px;
      align-items: center;
      gap: 10px;
      min-height: 36px;
      padding: 0 14px 0 calc(14px + var(--d, 0) * 18px);
      border-bottom: 1px solid rgba(255,255,255,0.04);
      cursor: pointer;
    }
    .row[style*="--d:1"], .row[style*="--d: 1"], .row.child {
      box-shadow: inset 2px 0 0 var(--line);
    }
    .row:hover { background: var(--hover); }
    .row.on { background: var(--active); }
    .tid {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 11px;
      color: var(--faint);
    }
    .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; color: #f7f8f8; }
    .chip {
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 1px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--mute);
      font-size: 11px;
      white-space: nowrap;
    }
    .chip.type {
      max-width: none;
      width: 3.6rem;
      text-align: center;
      padding: 1px 0;
    }
    .icon { width: 14px; height: 14px; display: block; }
    .icon circle { fill: none; stroke-width: 1.5; }
    .icon.todo circle { stroke: var(--todo); }
    .icon.draft circle { stroke: var(--draft); stroke-dasharray: 2.2 1.8; }
    .icon.progress circle { stroke: var(--progress); }
    .icon.progress path { fill: var(--progress); stroke: none; }
    .icon.blocked circle, .icon.blocked path { stroke: var(--blocked); fill: none; }
    .icon.done circle { fill: var(--done); stroke: var(--done); }
    .icon.done path { fill: none; stroke: #fff; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .pri { width: 14px; height: 14px; color: var(--faint); }
    .pri.high { color: var(--high); }
    .pri.medium { color: var(--medium); }
    .pri.low { color: var(--low); }
    .empty { color: var(--faint); padding: 28px 16px; }
    .sheet {
      overflow: auto;
      background: var(--elev);
      border-left: 1px solid var(--line);
    }
    .issue { padding: 22px 22px 40px; }
    .issue-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .sheet-close {
      flex: none;
      width: 28px;
      height: 28px;
      margin: -4px -6px 0 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--faint);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }
    .sheet-close:hover { background: var(--hover); color: var(--text); }
    .issue-id { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--faint); }
    .issue-id .uid { margin-top: 4px; font-size: 10px; word-break: break-all; color: var(--faint); }
    .title-edit {
      display: block;
      width: 100%;
      margin: 6px 0 18px;
      padding: 0;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.25;
      resize: none;
    }
    .title-edit:focus, .notes:focus, .blocked-edit:focus, .prop select:focus, .prop input:focus, .composer input:focus {
      outline: none;
      box-shadow: 0 0 0 1px #3d4260;
    }
    .props { display: grid; gap: 2px; margin-bottom: 22px; }
    .prop {
      display: grid;
      grid-template-columns: 92px 1fr;
      align-items: center;
      min-height: 32px;
      color: var(--faint);
      font-size: 12px;
    }
    .prop select, .prop input, .blocked-edit {
      height: 28px;
      padding: 0 6px;
      border-color: transparent;
      color: var(--text);
      color-scheme: dark;
    }
    .prop select:hover, .prop input:hover, .blocked-edit:hover { background: var(--hover); }
    .notes {
      min-height: 180px;
      padding: 10px 0;
      color: #d0d6e0;
      font-size: 14px;
      line-height: 1.55;
      resize: vertical;
    }
    .notes.accept { min-height: 88px; }
    .field-label {
      margin: 12px 0 4px;
      color: var(--faint);
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .actions { display: flex; gap: 8px; margin-top: 20px; }
    button.ghost, button.danger {
      height: 28px;
      padding: 0 10px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--mute);
      font: inherit;
      cursor: pointer;
    }
    button.ghost:hover { background: var(--hover); color: var(--text); }
    button.danger { color: #f2b8b5; }
    .err { color: var(--blocked); font-size: 12px; min-height: 1.2em; }
    .board {
      display: flex;
      gap: 10px;
      height: 100%;
      padding: 12px;
      overflow: auto;
      align-items: stretch;
    }
    .col {
      display: flex;
      flex-direction: column;
      flex: 1 1 220px;
      min-width: min(220px, 100%);
      max-width: 320px;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0c0d0e;
    }
    .col.over { outline: 1px solid var(--accent); }
    .col-head {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      padding: 0 10px;
      color: var(--mute);
      font-size: 12px;
      font-weight: 500;
      border-bottom: 1px solid var(--line);
    }
    .col-head .count { margin-left: auto; }
    .col-body { flex: 1; overflow: auto; padding: 8px; }
    .card {
      padding: 10px 10px 8px;
      margin-bottom: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--elev);
      cursor: grab;
    }
    .card:hover { background: var(--hover); }
    .card.on { box-shadow: inset 0 0 0 1px var(--accent); }
    .card-title { font-weight: 500; line-height: 1.35; margin-bottom: 8px; }
    .card-meta { display: flex; align-items: center; gap: 8px; }
    .card .chip { max-width: 120px; }
    .add-col {
      width: 100%;
      height: 28px;
      border: 0;
      background: transparent;
      color: var(--faint);
      font: inherit;
      text-align: left;
      padding: 0 10px 8px;
      cursor: pointer;
    }
    .add-col:hover { color: var(--text); }
    .app.is-board .sheet, .app.is-dag .sheet, .app.is-gantt .sheet, .app.is-qa .sheet, .app.is-json .sheet {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(420px, 42vw);
      z-index: 4;
      box-shadow: -18px 0 48px rgba(0,0,0,0.55);
    }
    .dag-wrap { padding: 8px 12px 28px; }
    .dag-legend {
      position: sticky;
      top: 0;
      z-index: 2;
      display: inline-flex;
      gap: 14px;
      margin: 0 0 10px;
      padding: 5px 9px;
      color: var(--faint);
      font-size: 11px;
      background: rgba(8,9,10,0.92);
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    .dag-legend i {
      display: inline-block;
      width: 18px;
      height: 0;
      margin: 0 6px 3px 0;
      border-top: 2px solid var(--accent);
      vertical-align: middle;
    }
    .dag-legend i.dep { border-top-style: dashed; border-top-color: var(--progress); }
    .dag-legend i.guard { border-top-color: var(--blocked); }
    .dag {
      position: relative;
      max-width: 100%;
    }
    .dag-sec {
      position: absolute;
      left: 0;
      right: 0;
      pointer-events: none;
      border-bottom: 3px solid var(--line);
    }
    .dag-sec-governs { background: rgba(235, 87, 87, 0.10); box-shadow: inset 3px 0 0 var(--blocked); }
    .dag-sec-tree { background: rgba(94, 106, 210, 0.07); box-shadow: inset 3px 0 0 var(--accent); }
    .dag-sec-loose { background: rgba(255, 255, 255, 0.045); box-shadow: inset 3px 0 0 var(--mute); }
    .dag-sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 32px;
      padding: 0 12px 0 14px;
      color: var(--text);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--line);
      background: rgba(8, 9, 10, 0.82);
    }
    .dag-sec-head span { color: var(--faint); font-variant-numeric: tabular-nums; letter-spacing: 0; text-transform: none; }
    .dag-edges {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }
    .dag-label {
      position: absolute;
      color: var(--faint);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .dag-node {
      position: absolute;
      display: grid;
      gap: 5px;
      padding: 8px 10px 8px 11px;
      border: 1px solid var(--line);
      border-left-width: 3px;
      border-radius: 8px;
      background: var(--elev);
      color: var(--text);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .dag-node:hover { background: var(--hover); }
    .dag-node.on { box-shadow: inset 0 0 0 1px var(--accent); }
    .dag-node.played { opacity: 0.42; }
    .dag-node.play {
      opacity: 1;
      z-index: 2;
      box-shadow: 0 0 0 1px var(--accent), 0 0 18px rgba(94,106,210,0.55);
      animation: dag-glow 0.8s ease-in-out infinite alternate;
    }
    @keyframes dag-glow {
      from { box-shadow: 0 0 0 1px var(--accent), 0 0 8px rgba(94,106,210,0.25); }
      to { box-shadow: 0 0 0 2px #c5c9f0, 0 0 28px rgba(94,106,210,0.85); }
    }
    .dag-node .meta { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .dag-node .ttl {
      font-weight: 500;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .dag-node.tone-GOAL { border-left-color: var(--accent); }
    .dag-node.tone-PLAN { border-left-color: #8b93e8; }
    .dag-node.tone-TASK { border-left-color: var(--faint); }
    .dag-node.tone-GUARD { border-left-color: var(--blocked); }
    .dag-node.tone-TEST { border-left-color: var(--progress); }
    .dag-node.tone-VALIDATION { border-left-color: #3fa68a; }
    .gantt-wrap { min-height: 100%; }
    .gantt-sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 32px;
      padding: 0 12px 0 14px;
      color: var(--text);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(8, 9, 10, 0.82);
      border-top: 3px solid var(--line);
      border-bottom: 1px solid var(--line);
      position: sticky;
      left: 0;
      z-index: 2;
    }
    .gantt-sec:first-of-type .gantt-sec-head { border-top: 0; }
    .gantt-sec-governs { background: rgba(235, 87, 87, 0.08); box-shadow: inset 3px 0 0 var(--blocked); }
    .gantt-sec-tree { background: rgba(94, 106, 210, 0.06); box-shadow: inset 3px 0 0 var(--accent); }
    .gantt-sec-loose { background: rgba(255, 255, 255, 0.04); box-shadow: inset 3px 0 0 var(--mute); }
    .gantt-sec-head span { color: var(--faint); font-variant-numeric: tabular-nums; letter-spacing: 0; text-transform: none; }
    .gantt-legend {
      display: inline-flex;
      gap: 14px;
      margin: 8px 12px 0;
      padding: 5px 9px;
      color: var(--faint);
      font-size: 11px;
      background: rgba(8,9,10,0.92);
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    .gantt-legend i {
      display: inline-block;
      width: 16px;
      height: 6px;
      margin: 0 6px 1px 0;
      border-radius: 2px;
      background: var(--accent);
      vertical-align: middle;
    }
    .gantt-legend i.span { width: 28px; opacity: 0.55; }
    .gantt-head, .gantt-body { position: relative; min-width: 100%; }
    .gantt-head {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      height: 28px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    .gantt-ticks, .gantt-track { position: relative; flex: 1; min-width: 0; }
    .gantt-tick {
      position: absolute;
      top: 7px;
      color: var(--faint);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      transform: translateX(4px);
    }
    .gantt-corner, .gantt-label {
      position: sticky;
      left: 0;
      z-index: 2;
      width: 188px;
      background: var(--panel);
    }
    .gantt-corner {
      display: flex;
      align-items: center;
      height: 28px;
      padding: 0 10px;
      color: var(--faint);
      font-size: 11px;
    }
    .gantt-row {
      display: flex;
      height: 28px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      cursor: pointer;
    }
    .gantt-row:hover { background: var(--hover); }
    .gantt-row.on { background: var(--active); }
    .gantt-row.on .gantt-label, .gantt-row:hover .gantt-label { background: inherit; }
    .gantt-label {
      flex: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px 0 calc(10px + var(--d, 0) * 12px);
      overflow: hidden;
    }
    .gantt-label .ttl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gantt-track { height: 28px; }
    .gantt-bar {
      position: absolute;
      top: 7px;
      height: 14px;
      border-radius: 4px;
      background: #6b7180;
      opacity: 0.88;
    }
    .gantt-bar.tone-GOAL { background: var(--accent); }
    .gantt-bar.tone-PLAN { background: #8b93e8; }
    .gantt-bar.tone-TASK { background: #6b7180; }
    .gantt-bar.tone-GUARD { background: var(--blocked); }
    .gantt-bar.tone-TEST { background: var(--progress); }
    .gantt-bar.tone-VALIDATION { background: #3fa68a; }
    .gantt-bar.done { opacity: 0.38; }
    .gantt-row.on .gantt-bar { box-shadow: 0 0 0 1px #fff; }
    #gantt-tip {
      position: fixed;
      z-index: 50;
      width: min(360px, calc(100vw - 24px));
      max-height: min(420px, calc(100vh - 24px));
      overflow: auto;
      padding: 11px 13px 12px;
      background: #121314;
      border: 1px solid var(--line);
      border-left-width: 3px;
      border-radius: 8px;
      box-shadow: 0 18px 44px rgba(0,0,0,0.58);
      pointer-events: none;
    }
    #gantt-tip[hidden], #gantt-tip:empty { display: none !important; }
    #gantt-tip.tone-GOAL { border-left-color: var(--accent); }
    #gantt-tip.tone-PLAN { border-left-color: #8b93e8; }
    #gantt-tip.tone-TASK { border-left-color: var(--faint); }
    #gantt-tip.tone-GUARD { border-left-color: var(--blocked); }
    #gantt-tip.tone-TEST { border-left-color: var(--progress); }
    #gantt-tip.tone-VALIDATION { border-left-color: #3fa68a; }
    .gantt-tip-id { color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
    .gantt-tip-ttl { margin: 5px 0 9px; font-size: 14px; font-weight: 500; letter-spacing: -0.01em; }
    .gantt-tip-kv { margin: 0; }
    .gantt-tip-kv div { display: grid; grid-template-columns: 78px 1fr; gap: 2px 10px; margin: 0 0 4px; }
    .gantt-tip-kv dt { color: var(--faint); font-size: 11px; }
    .gantt-tip-kv dd { margin: 0; color: var(--text); font-size: 12px; }
    .gantt-tip-notes { margin: 9px 0 0; color: #d0d6e0; font-size: 12.5px; line-height: 1.45; }
    .gantt-tip-req { margin: 8px 0 0; padding: 0 0 0 16px; color: var(--mute); font-size: 12px; }
    .gantt-tip-req li { margin: 0 0 3px; }
    .gantt-today {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--accent);
      pointer-events: none;
      z-index: 1;
    }
    .gantt-mile {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 0;
      border-left: 1px dashed var(--mute);
      pointer-events: none;
    }
    .json-wrap { padding: 8px 12px 28px; }
    .json-legend {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 10px;
      padding: 5px 9px;
      color: var(--faint);
      font-size: 11px;
      background: rgba(8,9,10,0.92);
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    .json-copies { margin-left: auto; display: flex; gap: 14px; align-items: center; }
    .json-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 11px;
      background: none;
      border: 0;
      padding: 0;
      font: inherit;
      cursor: pointer;
    }
    .json-link:hover { text-decoration: underline; color: var(--text); }
    .json-pack, .json-card pre {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11.5px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .json-pack {
      margin: 0 0 10px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--elev);
      color: var(--mute);
    }
    .json-card {
      display: block;
      width: 100%;
      margin: 0 0 8px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-left-width: 2px;
      border-radius: 8px;
      background: var(--elev);
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }
    .json-card:hover { background: var(--hover); }
    .json-card.on { box-shadow: inset 0 0 0 1px var(--accent); }
    .json-card.tone-GOAL { border-left-color: var(--accent); }
    .json-card.tone-PLAN { border-left-color: #8b93e8; }
    .json-card.tone-TASK { border-left-color: var(--faint); }
    .json-card.tone-GUARD { border-left-color: var(--blocked); }
    .json-card.tone-TEST { border-left-color: var(--progress); }
    .json-card.tone-VALIDATION { border-left-color: #3fa68a; }
    .json-card .jk { color: #8b93e8; }
    .qa-wrap { padding: 10px 14px 28px; }
    .qa-hero {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin: 0 0 12px;
      font-variant-numeric: tabular-nums;
    }
    .qa-hero b {
      font-size: 42px;
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 1;
    }
    .qa-hero.ok b { color: #3fa68a; }
    .qa-hero.mid b { color: var(--progress); }
    .qa-hero.bad b { color: var(--blocked); }
    .qa-hero span { color: var(--faint); font-size: 13px; }
    .qa-note { margin: 0 0 14px; color: var(--mute); font-size: 12px; }
    .qa-counts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 16px;
    }
    .qa-counts span {
      padding: 3px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--mute);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .qa-counts b { color: var(--text); font-weight: 600; }
    .qa-hit {
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 8px 12px;
      margin: 0 0 8px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--elev);
    }
    .qa-hit .pts { color: var(--blocked); font-variant-numeric: tabular-nums; font-weight: 600; }
    .qa-hit .code { color: var(--text); font-size: 12px; font-weight: 500; }
    .qa-hit .msg { color: var(--mute); font-size: 12px; margin: 3px 0 6px; }
    .qa-ids { display: flex; flex-wrap: wrap; gap: 6px; }
    .qa-id {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      padding: 2px 8px;
      cursor: pointer;
    }
    .qa-id:hover, .qa-id.on { background: var(--active); border-color: var(--accent); }
    .qa-ok { color: #3fa68a; font-size: 13px; }
    @media (max-width: 1100px) {
      .app { grid-template-columns: minmax(160px, 200px) minmax(0, 1fr) minmax(240px, 34vw); }
      .app.is-board .sheet, .app.is-dag .sheet, .app.is-gantt .sheet, .app.is-qa .sheet, .app.is-json .sheet {
        width: min(360px, 48vw);
      }
    }
    @media (max-width: 860px) {
      .app, .app.no-sheet, .app.is-board, .app.is-dag, .app.is-gantt, .app.is-qa, .app.is-json {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto minmax(0, 1fr) auto;
      }
      aside {
        display: flex;
        max-height: min(34vh, 260px);
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .sheet {
        border-left: 0;
        border-top: 1px solid var(--line);
        max-height: 44vh;
      }
      .app.is-board .sheet, .app.is-dag .sheet, .app.is-gantt .sheet, .app.is-qa .sheet, .app.is-json .sheet {
        position: static;
        width: 100%;
        max-height: 44vh;
        box-shadow: none;
      }
      .poll { margin-left: 0; }
      .gantt-label, .gantt-corner { width: min(188px, 42vw); }
    }
  </style>
</head>
<body>
  <div class="app no-sheet" id="app">
    <aside>
      <div class="workspace">
        <div class="mark-team" aria-hidden="true"></div>
        <div>
          <h1 id="name">docket</h1>
          <small id="cite">editor</small>
        </div>
      </div>
      <button class="new" id="new" type="button">New issue</button>
      <div class="nav-label">Issues</div>
      <div id="nav"></div>
      <section class="stats" id="stats" aria-label="Docket statistics"></section>
    </aside>
    <main>
      <div class="toolbar">
        <h2 id="view-title">All issues</h2>
        <div class="views" role="tablist">
          <button type="button" id="view-list" class="on" title="List" aria-label="List view">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><rect x="1" y="2" width="12" height="1.7" rx=".4"/><rect x="1" y="6.15" width="12" height="1.7" rx=".4"/><rect x="1" y="10.3" width="12" height="1.7" rx=".4"/></svg>
          </button>
          <button type="button" id="view-board" title="Board" aria-label="Board view">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><rect x="1" y="1.5" width="3.4" height="11" rx=".7"/><rect x="5.3" y="1.5" width="3.4" height="11" rx=".7"/><rect x="9.6" y="1.5" width="3.4" height="11" rx=".7"/></svg>
          </button>
          <button type="button" id="view-dag" title="DAG" aria-label="DAG view">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><circle cx="7" cy="2.7" r="1.7"/><circle cx="2.7" cy="11.2" r="1.7"/><circle cx="11.3" cy="11.2" r="1.7"/><path d="M6.1 4.1L3.6 9.5M7.9 4.1L10.4 9.5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
          </button>
          <button type="button" id="view-gantt" title="Gantt" aria-label="Gantt view">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><rect x="1" y="2.2" width="8" height="2" rx=".4"/><rect x="3" y="6" width="10" height="2" rx=".4"/><rect x="2" y="9.8" width="6" height="2" rx=".4"/></svg>
          </button>
          <button type="button" id="view-qa" title="Plan QA" aria-label="Plan QA view">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.4" y="1.6" width="9.2" height="10.8" rx="1.4"/><path d="M4.6 7.2l1.7 1.7 3.2-3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button type="button" id="view-json" title="JSON" aria-label="JSON view">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M5 2.4c-1.6 0-2.1 1.3-2.1 2.2 0 1.1-.7 1.4-.7 2.4s.7 1.3.7 2.4c0 .9.5 2.2 2.1 2.2M9 2.4c1.6 0 2.1 1.3 2.1 2.2 0 1.1.7 1.4.7 2.4s-.7 1.3-.7 2.4c0 .9-.5 2.2-2.1 2.2"/></svg>
          </button>
        </div>
        <button type="button" class="dag-play" id="dag-play" hidden title="Play DAG levels" aria-label="Play DAG levels">
          <svg class="dag-play-icon" width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M4 2.6v8.8l8-4.4z"/></svg>
        </button>
        <span class="dag-play-meta" id="dag-play-meta" hidden></span>
        <span class="poll" id="poll" role="meter" aria-valuemin="0" aria-valuemax="1" aria-valuenow="1" title="Time until next pack check" aria-label="Time until next pack check">
          <span class="poll-pie" id="poll-pie"></span>
        </span>
        <input id="q" type="search" placeholder="Search any field" autocomplete="off">
      </div>
      <form class="composer" id="composer">
        <input name="title" placeholder="Issue title" autocomplete="off" required>
        <textarea class="brief" name="notes" placeholder="User story or technical brief — not the title. Two sentences minimum." required></textarea>
        <textarea name="requirements" placeholder="Requirements, one per line (at least two)" required></textarea>
        <textarea name="cases" placeholder="Test cases, one per line (two if type TEST)" required></textarea>
        <textarea name="acceptance" placeholder="Acceptance criteria, one per line (at least two)" required></textarea>
        <button class="new" type="submit" style="width:auto;margin:0;padding:0 12px;align-self:end">Create</button>
      </form>
      <div class="list" id="list"></div>
    </main>
    <section class="sheet" id="sheet" hidden></section>
  </div>
  <div id="gantt-tip" hidden role="tooltip"></div>
  <script>
    const $ = (id) => document.getElementById(id);
    const FILTERS = [
      ["all", "All issues"],
      ["To Do", "Todo"],
      ["In Progress", "In Progress"],
      ["Done", "Done"],
      ["Draft", "Draft"],
      ["blocked", "Blocked"],
    ];
    const COLUMNS = ["To Do", "In Progress", "Done", "Draft"];
    const params = new URLSearchParams(location.search);
    let state = { tasks: [], milestones: [], project: {}, tool: {} };
    let selected = params.get("id") || "";
    let view = ["board", "dag", "gantt", "qa", "json"].includes(params.get("view")) ? params.get("view") : "list";
    let filter = "all";
    let query = "";
    let addCol = "";
    let rev = "";
    let pollBusy = false;
    const POLL_MS = 5000;
    let pollAt = 0;
    const PLAY_MS = 2000;
    let dagPlay = { timer: 0, level: -1, levels: [] };

    function syncURL() {
      const next = new URLSearchParams();
      if (view !== "list") next.set("view", view);
      if (selected) next.set("id", selected);
      history.replaceState(null, "", next.toString() ? "?" + next.toString() : location.pathname);
    }

    function kind(t) {
      if (t.blocked_reason) return "blocked";
      if (t.status === "In Progress") return "progress";
      if (t.status === "Done") return "done";
      if (t.status === "Draft") return "draft";
      return "todo";
    }

    function statusMark(t) {
      const k = kind(t);
      if (k === "done") return `<svg class="icon done" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6"/><path d="M4.2 7.1l1.8 1.8 3.8-3.8"/></svg>`;
      if (k === "progress") return `<svg class="icon progress" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6"/><path d="M7 2.2A4.8 4.8 0 0 1 11.8 7H7z"/></svg>`;
      if (k === "blocked") return `<svg class="icon blocked" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6"/><path d="M4.2 4.2l5.6 5.6"/></svg>`;
      return `<svg class="icon ${k}" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6"/></svg>`;
    }

    function priMark(p) {
      const n = p === "high" ? 3 : p === "medium" ? 2 : p === "low" ? 1 : 0;
      if (!n) return `<svg class="pri" viewBox="0 0 14 14"><circle cx="7" cy="7" r="4.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="1.6 1.5"/></svg>`;
      const bars = [[3,10],[6,8],[9,6]].slice(0, n).map(([x,h]) => `<rect x="${x}" y="${14-h-2}" width="2" height="${h}" rx="0.6" fill="currentColor"/>`).join("");
      return `<svg class="pri ${p}" viewBox="0 0 14 14">${bars}</svg>`;
    }

    function milestoneTitle(id) {
      const m = (state.milestones || []).find((x) => x.id === id);
      return m ? m.title : id;
    }

    function counts() {
      const c = { all: state.tasks.length, "To Do": 0, "In Progress": 0, Done: 0, Draft: 0, blocked: 0 };
      for (const t of state.tasks) {
        c[t.status] = (c[t.status] || 0) + 1;
        if (t.blocked_reason) c.blocked += 1;
      }
      return c;
    }

    function fmtBytes(n) {
      n = Math.max(0, Number(n) || 0);
      if (n < 1000) return Math.round(n) + " B";
      if (n < 1000000) {
        const kb = n / 1000;
        return (kb < 100 ? kb.toFixed(1) : String(Math.round(kb))).replace(/\.0$/, "") + " KB";
      }
      return (n / 1000000).toFixed(1).replace(/\.0$/, "") + " MB";
    }

    function fmtTok(bytes) {
      const t = Math.round((Number(bytes) || 0) / 4);
      if (t < 1000) return "~" + t + " tok";
      const k = t / 1000;
      return "~" + (k < 100 ? k.toFixed(1) : String(Math.round(k))).replace(/\.0$/, "") + "k tok";
    }

    function packStats() {
      const tasks = state.tasks || [];
      const types = { GOAL: 0, PLAN: 0, TASK: 0, GUARD: 0, TEST: 0, VALIDATION: 0 };
      let hollow = 0, noUid = 0, blocked = 0, high = 0, unparentedGuard = 0;
      const guarded = new Set();
      const validated = new Set();
      const workKids = new Set();
      for (const t of tasks) {
        const typ = t.type || "TASK";
        types[typ] = (types[typ] || 0) + 1;
        const notes = (t.notes || "").trim();
        const req = (t.requirements || []).filter((x) => String(x).trim());
        const cases = (t["test-cases"] || []).filter((x) => String(x).trim());
        const acc = (t["acceptance-criteria"] || []).filter((x) => String(x).trim());
        const sentences = (notes.match(/[.!?]/g) || []).length;
        const minCases = typ === "TEST" ? 2 : 1;
        if (!notes || notes.toLowerCase() === (t.title || "").trim().toLowerCase() || notes.length < 160 || sentences < 2 || req.length < 2 || cases.length < minCases || acc.length < 2) hollow += 1;
        if (!t.uid) noUid += 1;
        if (t.blocked_reason) blocked += 1;
        if (t.priority === "high") high += 1;
        if (typ === "GUARD") {
          if (t.parent) guarded.add(t.parent);
          else unparentedGuard += 1;
        }
        if (typ === "VALIDATION" && t.parent) validated.add(t.parent);
        if (t.parent && ["GOAL", "PLAN", "TASK"].includes(typ)) workKids.add(t.parent);
      }
      const goals = types.GOAL || 0;
      const unguarded = tasks.filter((t) => (t.type || "") === "GOAL" && !guarded.has(t.id)).length;
      const unvalidated = tasks.filter((t) => workKids.has(t.id) && !validated.has(t.id)).length;
      const miles = state.milestones || [];
      const size = state.size || {};
      return {
        types, total: tasks.length, visible: visible().length,
        hollow, noUid, blocked, high, unparentedGuard, goals, unguarded, unvalidated,
        miles: miles.length, openMs: miles.filter((m) => m.status !== "closed").length,
        primBytes: size.bytes || 0, jsonlBytes: size.jsonl || 0,
      };
    }

    function statsHTML() {
      const s = packStats();
      const sc = state.score || {};
      const n = Number(sc.score);
      const max = Number(sc.max) || 100;
      const tone = n >= 100 ? "ok" : n >= 50 ? "mid" : "bad";
      const types = ["GOAL", "PLAN", "TASK", "GUARD", "TEST", "VALIDATION"].map((k) =>
        `<span class="stats-type tone-${k}"><b>${s.types[k] || 0}</b>${k}</span>`
      ).join("");
      const bit = (n, label, bad) => n ? `<span class="${bad ? "bad" : ""}">${n} ${label}</span>` : "";
      const guarded = s.goals ? `<span class="${s.unguarded ? "bad" : ""}">${s.goals - s.unguarded}/${s.goals} goals guarded</span>` : "";
      return `<div class="stats-score ${Number.isFinite(n) ? tone : ""}" title="Deterministic plan shape. Not meaning.">
          <b>${Number.isFinite(n) ? n : "—"}</b><span>/${max} plan</span>
        </div>
        <div class="stats-size" title="Token estimate is bytes / 4">
          <div><span>prim</span><b>${fmtBytes(s.primBytes)}</b><em>${fmtTok(s.primBytes)}</em></div>
          <div><span>jsonl</span><b>${fmtBytes(s.jsonlBytes)}</b><em>${fmtTok(s.jsonlBytes)}</em></div>
        </div>
        <div class="stats-types">${types}</div>
        <div class="stats-row">
          <span>${s.total} cards</span>
          ${s.visible !== s.total ? `<span>${s.visible} showing</span>` : ""}
          <span>${s.openMs}/${s.miles} milestones open</span>
          ${guarded}
          ${bit(s.unvalidated, "unvalidated parents", true)}
          ${bit(s.hollow, "hollow", true)}
          ${bit(s.unparentedGuard, "unparented guards", true)}
          ${bit(s.noUid, "no uid", true)}
          ${bit(s.blocked, "blocked")}
          ${bit(s.high, "high")}
        </div>`;
    }

    function cardBlob(t) {
      try { return JSON.stringify(t).toLowerCase(); } catch (_) { return ""; }
    }

    function visible() {
      return state.tasks.filter((t) => {
        if (filter === "blocked" && !t.blocked_reason) return false;
        if (filter !== "all" && filter !== "blocked" && t.status !== filter) return false;
        if (query && !cardBlob(t).includes(query)) return false;
        return true;
      });
    }

    function siblingRank(t) {
      const typ = t.type || "TASK";
      if (typ === "GUARD") return 0;
      if (typ === "VALIDATION") return 2;
      return 1;
    }

    function treeWalk(rows) {
      const ids = new Set(rows.map((t) => t.id));
      const kids = new Map();
      for (const t of rows) {
        const p = t.parent && ids.has(t.parent) ? t.parent : "";
        if (!kids.has(p)) kids.set(p, []);
        kids.get(p).push(t);
      }
      for (const arr of kids.values()) {
        arr.sort((a, b) => siblingRank(a) - siblingRank(b));
      }
      const out = [];
      const walk = (pid, depth) => {
        for (const t of kids.get(pid) || []) {
          out.push({ t, depth });
          walk(t.id, depth + 1);
        }
      };
      walk("", 0);
      return out;
    }

    function viewWidth() {
      const el = $("list");
      const w = el && el.clientWidth ? el.clientWidth : (typeof window !== "undefined" ? window.innerWidth : 800);
      return Math.max(280, w - 24);
    }

    function dagLayout(rows) {
      const guards = rows.filter((t) => (t.type || "TASK") === "GUARD")
        .slice()
        .sort((a, b) => (a.parent || "").localeCompare(b.parent || "") || a.id.localeCompare(b.id));
      const work = rows.filter((t) => (t.type || "TASK") !== "GUARD");
      const ids = new Set(work.map((t) => t.id));
      const kids = new Map();
      for (const t of work) {
        const p = t.parent && ids.has(t.parent) ? t.parent : "";
        if (!kids.has(p)) kids.set(p, []);
        kids.get(p).push(t);
      }
      for (const arr of kids.values()) {
        arr.sort((a, b) => siblingRank(a) - siblingRank(b));
      }
      const linked = new Set();
      for (const t of work) {
        if (t.parent && ids.has(t.parent)) {
          linked.add(t.id);
          linked.add(t.parent);
        }
        for (const d of t.dependencies || []) {
          if (!ids.has(d)) continue;
          linked.add(t.id);
          linked.add(d);
        }
      }
      const avail = viewWidth();
      const NH = 62, GX = 14, GY = 72, HEAD = 32, PAD = 14, GAP = 10;
      const NW = avail < 520 ? 140 : avail < 720 ? 160 : 188;
      const maxCols = Math.max(1, Math.floor((avail - 16) / (NW + GX)));
      const pos = {};
      const sections = [];
      let y = 0;
      const placeGrid = (list, top) => {
        const cols = Math.max(1, Math.min(maxCols, list.length || 1));
        list.forEach((t, i) => {
          pos[t.id] = {
            x: 8 + (i % cols) * (NW + GX),
            y: top + Math.floor(i / cols) * (NH + 14),
            t,
          };
        });
        const rowsN = Math.ceil((list.length || 1) / cols);
        return { cols, height: rowsN * (NH + 14) - 14 };
      };
      if (guards.length) {
        const body = placeGrid(guards, y + HEAD + PAD);
        const h = HEAD + PAD + body.height + PAD;
        sections.push({ key: "governs", title: "Governs", top: y, height: h, count: guards.length });
        y += h + GAP;
      }
      const linkedKids = (id) => (kids.get(id) || []).filter((c) => linked.has(c.id));
      const subtreeW = (t) => {
        const cs = linkedKids(t.id);
        if (!cs.length) return NW;
        return Math.max(NW, cs.reduce((w, c, i) => w + subtreeW(c) + (i ? GX : 0), 0));
      };
      const roots = (kids.get("") || []).filter((t) => linked.has(t.id));
      if (roots.length) {
        const dagTop = y + HEAD + PAD;
        const place = (t, depth, left) => {
          const w = subtreeW(t);
          pos[t.id] = { x: left + (w - NW) / 2, y: dagTop + depth * (NH + GY), t };
          let x = left;
          for (const c of linkedKids(t.id)) {
            place(c, depth + 1, x);
            x += subtreeW(c) + GX;
          }
          return w;
        };
        let x = 8;
        for (const t of roots) x += place(t, 0, x) + GX;
        const treeBottom = Object.values(pos).reduce((m, p) => {
          if (!linked.has(p.t.id)) return m;
          return Math.max(m, p.y + NH);
        }, dagTop);
        const h = treeBottom - y + PAD;
        sections.push({ key: "tree", title: "Hierarchy", top: y, height: h, count: linked.size });
        y += h + GAP;
      }
      const loose = work.filter((t) => !linked.has(t.id));
      if (loose.length) {
        const body = placeGrid(loose, y + HEAD + PAD);
        const h = HEAD + PAD + body.height + PAD;
        sections.push({ key: "loose", title: "No parent", top: y, height: h, count: loose.length });
        y += h;
      }
      const edges = [];
      for (const t of work) {
        if (t.parent && pos[t.parent] && pos[t.id]) {
          edges.push({ a: t.parent, b: t.id, kind: "parent" });
        }
        for (const d of t.dependencies || []) {
          if (pos[d] && pos[t.id] && d !== t.parent) edges.push({ a: d, b: t.id, kind: "dep" });
        }
      }
      for (const t of guards) {
        if (t.parent && pos[t.parent] && pos[t.id]) {
          edges.push({ a: t.id, b: t.parent, kind: "guard" });
        }
      }
      const width = Math.max(avail, ...Object.values(pos).map((p) => p.x + NW), 8) + 24;
      const height = Math.max(160, y, ...Object.values(pos).map((p) => p.y + NH), 8) + 8;
      return { pos, edges, width, height, NW, NH, sections };
    }

    function dagRanks(rows) {
      rows = rows.filter((t) => (t.type || "TASK") !== "GUARD");
      const ids = new Set(rows.map((t) => t.id));
      const preds = new Map();
      for (const t of rows) {
        const p = [];
        if (t.parent && ids.has(t.parent)) p.push(t.parent);
        for (const d of t.dependencies || []) {
          if (ids.has(d) && d !== t.parent) p.push(d);
        }
        preds.set(t.id, p);
      }
      const rank = {};
      const visiting = new Set();
      const walk = (id) => {
        if (rank[id] != null) return rank[id];
        if (visiting.has(id)) return 0;
        visiting.add(id);
        let r = 0;
        for (const p of preds.get(id) || []) r = Math.max(r, walk(p) + 1);
        visiting.delete(id);
        rank[id] = r;
        return r;
      };
      for (const t of rows) walk(t.id);
      const levels = [];
      for (const t of rows) {
        const r = rank[t.id] || 0;
        if (!levels[r]) levels[r] = [];
        levels[r].push(t.id);
      }
      return levels.map((ids) => ids || []).filter((ids) => ids.length);
    }

    function stopDagPlay() {
      if (dagPlay.timer) clearTimeout(dagPlay.timer);
      dagPlay = { timer: 0, level: -1, levels: [] };
      paintDagPlay();
    }

    function paintDagPlay() {
      const btn = $("dag-play");
      const meta = $("dag-play-meta");
      const playing = dagPlay.level >= 0 && dagPlay.levels.length > 0;
      if (btn) {
        btn.classList.toggle("on", !!dagPlay.timer);
        btn.hidden = view !== "dag";
        btn.setAttribute("aria-label", dagPlay.timer ? "Stop DAG play" : "Play DAG levels");
        btn.title = dagPlay.timer ? "Stop" : "Play DAG levels";
        const icon = btn.querySelector(".dag-play-icon");
        if (icon) {
          icon.innerHTML = dagPlay.timer
            ? '<rect x="3.5" y="3.5" width="7" height="7" rx="1"/>'
            : '<path d="M4 2.6v8.8l8-4.4z"/>';
        }
      }
      if (meta) {
        meta.hidden = view !== "dag" || !playing;
        if (playing) {
          const n = (dagPlay.levels[dagPlay.level] || []).length;
          meta.textContent = `Level ${dagPlay.level + 1}/${dagPlay.levels.length} · ${n} at once`;
        } else {
          meta.textContent = "";
        }
      }
      const current = new Set(dagPlay.levels[dagPlay.level] || []);
      const done = new Set();
      for (let i = 0; i < dagPlay.level; i++) {
        for (const id of dagPlay.levels[i] || []) done.add(id);
      }
      document.querySelectorAll(".dag-node").forEach((el) => {
        el.classList.toggle("play", current.has(el.dataset.id));
        el.classList.toggle("played", done.has(el.dataset.id));
      });
      const wrap = document.querySelector(".dag-wrap");
      if (wrap) {
        wrap.dataset.playLevel = playing ? String(dagPlay.level) : "";
        wrap.dataset.playParallel = playing ? String(current.size) : "";
      }
    }

    function startDagPlay() {
      if (view !== "dag") return;
      if (dagPlay.timer) {
        stopDagPlay();
        return;
      }
      const levels = dagRanks(visible());
      if (!levels.length) return;
      dagPlay.levels = levels;
      dagPlay.level = 0;
      paintDagPlay();
      const tick = () => {
        dagPlay.level++;
        if (dagPlay.level >= dagPlay.levels.length) {
          stopDagPlay();
          return;
        }
        paintDagPlay();
        dagPlay.timer = setTimeout(tick, PLAY_MS);
      };
      dagPlay.timer = setTimeout(tick, PLAY_MS);
      paintDagPlay();
    }

    async function load() {

    function holdPoll() {
      if (document.hidden || addCol || dagPlay.timer) return true;
      const el = document.activeElement;
      if (!el || el === document.body || el.id === "q") return false;
      const tag = el.tagName;
      return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";

    async function tick() {
      if (pollBusy) return;
      pollBusy = true;
      try {
        const res = await fetch("/api/rev");
        if (!res.ok) return;
        const next = await res.json();
        if (next.rev && next.rev !== rev) await load();
      } catch (_) {
      } finally {
        pollBusy = false;
      }
    }

    function armPoll() {
      pollAt = performance.now() + POLL_MS;

    function paintPie(remain, held) {
      const pie = $("poll-pie");
      const poll = $("poll");
      if (!pie || !poll) return;
      const p = Math.max(0, Math.min(1, remain / POLL_MS));
      pie.style.setProperty("--p", (p * 100).toFixed(2) + "%");
      poll.classList.toggle("is-hold", held);
      poll.setAttribute("aria-valuenow", p.toFixed(2));
    }

    async function watch() {
      const remain = pollAt - performance.now();
      const held = holdPoll();
      if (!pollBusy && remain <= 0) {
        paintPie(0, held);
        if (!held) {
          await tick();
          armPoll();
        }
      } else {
        paintPie(remain, held);
      }
      requestAnimationFrame(watch);
    }

    function dagHTML() {

      const path = (e) => {
        const a = g.pos[e.a], b = g.pos[e.b];
        const x1 = a.x + g.NW / 2, y1 = a.y + g.NH;

      const edges = g.edges.map((e) => {
        const stroke = e.kind === "dep" ? "var(--progress)" : e.kind === "guard" ? "var(--blocked)" : "var(--accent)";
        const mark = e.kind === "dep" ? "arr-d" : e.kind === "guard" ? "arr-g" : "arr-p";
        const dash = e.kind === "dep" ? 'stroke-dasharray="5 3.5"' : "";
        return `<path d="${path(e)}" fill="none" stroke="${stroke}" stroke-width="1.4" ${dash} marker-end="url(#${mark})"/>`;
      }).join("");
      const nodes = Object.values(g.pos).map(({ t, x, y }) => `

          <div class="meta">${statusMark(t)}<span class="tid">${t.id.replace("TASK-", "")}</span><span class="chip type">${esc(t.type || "TASK")}</span></div>

      const secs = (g.sections || []).map((s) => `
        <section class="dag-sec dag-sec-${esc(s.key)}" style="top:${s.top}px;height:${s.height}px">
          <div class="dag-sec-head">${esc(s.title)}<span>${s.count}</span></div>

        <div class="dag-legend"><span><i></i>parent</span><span><i class="guard"></i>guard</span><span><i class="dep"></i>depends</span></div>
        <div class="dag" style="width:${g.width}px;height:${g.height}px">
          ${secs}
          <svg class="dag-edges" viewBox="0 0 ${g.width} ${g.height}">

              <marker id="arr-p" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1.2L8 4L0 6.8Z" fill="#5e6ad2"/></marker>
              <marker id="arr-d" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1.2L8 4L0 6.8Z" fill="#f2c14e"/></marker>
              <marker id="arr-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1.2L8 4L0 6.8Z" fill="#eb5757"/></marker>
            </defs>
            ${edges}
          </svg>

        </div>
      </div>`;
    }

    function ganttLayout(rows) {
      const levels = dagRanks(rows);
      const rankOf = {};
      levels.forEach((ids, i) => ids.forEach((id) => { rankOf[id] = i; }));
      const ids = new Set(rows.map((t) => t.id));
      const kids = new Map();
      for (const t of rows) {
        const p = t.parent && ids.has(t.parent) ? t.parent : "";
        if (!kids.has(p)) kids.set(p, []);
        kids.get(p).push(t);
      }
      const far = {};
      const walk = (id) => {
        if (far[id] != null) return far[id];
        let m = rankOf[id] || 0;
        for (const c of kids.get(id) || []) {
          if ((c.type || "TASK") === "GUARD") continue;
          m = Math.max(m, walk(c.id));
        }
        far[id] = m;
        return m;
      };
      for (const t of rows) walk(t.id);
      const shift = rows.some((t) => (t.type || "TASK") === "GUARD") ? 1 : 0;
      const workMax = levels.length ? levels.length - 1 : 0;
      const n = Math.max(1, shift + workMax + 1);
      return {
        n, shift,
        colOf: (t) => ((t.type || "TASK") === "GUARD" ? 0 : shift + (rankOf[t.id] || 0)),
        spanOf: (t) => {
          if ((t.type || "TASK") === "GUARD") return 1;
          const a = rankOf[t.id] || 0;
          return Math.max(1, (far[t.id] || a) - a + 1);
        },
      };
    }
    function splitWork(rows) {
      const guards = rows.filter((t) => (t.type || "TASK") === "GUARD")
        .slice()
        .sort((a, b) => (a.parent || "").localeCompare(b.parent || "") || a.id.localeCompare(b.id));
      const work = rows.filter((t) => (t.type || "TASK") !== "GUARD");
      const ids = new Set(work.map((t) => t.id));
      const linked = new Set();
      for (const t of work) {
        if (t.parent && ids.has(t.parent)) {
          linked.add(t.id);
          linked.add(t.parent);
        }
        for (const d of t.dependencies || []) {
          if (!ids.has(d)) continue;
          linked.add(t.id);
          linked.add(d);
        }
      }
      return {
        guards,
        tree: treeWalk(work.filter((t) => linked.has(t.id))),
        loose: work.filter((t) => !linked.has(t.id)),
      };
    }
    function ganttHTML() {
      const rows = visible();
      if (!rows.length) return '<div class="empty">No issues.</div>';
      const g = ganttLayout(rows);
      const parts = splitWork(rows);
      const head = Array.from({ length: g.n }, (_, i) => {
        const label = g.shift && i === 0 ? "Gov" : "L" + (i - g.shift + 1);
        return `<span class="gantt-tick" style="left:${((i + 0.02) / g.n * 100).toFixed(3)}%">${esc(label)}</span>`;
      }).join("");
      const tick = (i) => g.shift && i === 0 ? "Gov" : "L" + (i - g.shift + 1);
      const rowHTML = (t, depth) => {
        const col = g.colOf(t);
        const span = g.spanOf(t);
        const left = (col / g.n * 100).toFixed(3);
        const width = (span / g.n * 100).toFixed(3);
        const done = t.status === "Done" ? " done" : "";
        const from = tick(col);
        const rank = span > 1 ? from + "–" + tick(col + span - 1) : from;
        return `<div class="gantt-row ${t.id === selected ? "on" : ""}" data-id="${t.id}" data-rank="${esc(rank)}" style="--d:${depth || 0}">
          <div class="gantt-label">${statusMark(t)}<span class="tid">${t.id.replace("TASK-", "")}</span><span class="ttl">${esc(t.title)}</span></div>
          <div class="gantt-track">
            <span class="gantt-bar tone-${esc(t.type || "TASK")}${done}" style="left:${left}%;width:calc(${width}% - 6px)"></span>
          </div>
        </div>`;
      };
      const sec = (key, title, items) => {
        if (!items.length) return "";
        const body = items.map((item) => item.t ? rowHTML(item.t, item.depth) : rowHTML(item, 0)).join("");
        return `<section class="gantt-sec gantt-sec-${esc(key)}">
          <div class="gantt-sec-head">${esc(title)}<span>${items.length}</span></div>
          ${body}
        </section>`;
      };
      return `<div class="gantt-wrap">
        <div class="gantt-legend"><span><i></i>rank</span><span><i class="span"></i>parent spans children</span><span>hover a row for the card</span></div>
        <div class="gantt-head">
          <span class="gantt-corner">Rank</span>
          <div class="gantt-ticks">${head}</div>
        </div>
        <div class="gantt-body">
          ${sec("governs", "Governs", parts.guards)}
          ${sec("tree", "Hierarchy", parts.tree)}
          ${sec("loose", "No parent", parts.loose)}
        </div>
      </div>`;
    }

    function qaHTML() {
      const sc = state.score || { score: 0, max: 100, deductions: [], counts: {} };
      const n = Number(sc.score);
      const max = Number(sc.max) || 100;
      const tone = n >= 100 ? "ok" : n >= 50 ? "mid" : "bad";
      const vis = new Set(visible().map((t) => t.id));
      const c = sc.counts || {};
      const counts = [
        ["GOAL", c.goals], ["PLAN", c.plans], ["TASK", c.tasks],
        ["GUARD", c.guards], ["TEST", c.tests], ["VALIDATION", c.validations],
        ["MS", c.milestones],
      ].map(([k, v]) => `<span><b>${v || 0}</b> ${k}</span>`).join("");
      const hits = (sc.deductions || []).filter((d) => {
        if (!query) return true;
        const blob = `${d.code} ${d.msg} ${(d.ids || []).join(" ")}`.toLowerCase();
        return blob.includes(query) || (d.ids || []).some((id) => vis.has(id));
      });
      const body = hits.map((d) => {
        const ids = (d.ids || []).map((id) =>
          `<button type="button" class="qa-id ${id === selected ? "on" : ""}" data-id="${esc(id)}">${esc(id.replace("TASK-", ""))}</button>`
        ).join("");
        const extra = d.count > 1 ? ` ×${d.count}` : "";
        return `<div class="qa-hit">
          <div class="pts">−${d.points}</div>
          <div>
            <div class="code">${esc(d.code)}${extra}</div>
            <div class="msg">${esc(d.msg)}</div>
            ${ids ? `<div class="qa-ids">${ids}</div>` : ""}
          </div>
        </div>`;
      }).join("");
      const clean = !hits.length && n >= 100 ? '<div class="qa-ok">Graph is clean. Hollow notes still go through validate.</div>' : (body || '<div class="empty">No matching deductions.</div>');
      return `<div class="qa-wrap">
        <div class="qa-hero ${tone}"><b>${Number.isFinite(n) ? n : "—"}</b><span>/${max} plan</span></div>
        <p class="qa-note">Quantitative graph bar. Same number as docket-prim score. Not meaning.</p>
        <div class="qa-counts">${counts}</div>
        ${clean}
      </div>`;
    }

    function clipText(s, n) {
      s = String(s || "").trim();
      if (s.length <= n) return s;
      const cut = s.slice(0, n);
      const sp = cut.lastIndexOf(" ");
      return (sp > 80 ? cut.slice(0, sp) : cut) + "…";
    }
    function nameOf(id) {
      const x = state.tasks.find((r) => r.id === id);
      return x ? x.id.replace("TASK-", "") + "  " + x.title : id;
    }
    function ganttTipHTML(t, rank) {
      const typ = t.type || "TASK";
      const req = (t.requirements || []).filter(Boolean);
      const cases = (t["test-cases"] || []).filter(Boolean);
      const acc = (t["acceptance-criteria"] || []).filter(Boolean);
      const deps = (t.dependencies || []).filter(Boolean);
      const parentNoun = typ === "GUARD" ? "Constrains" : typ === "VALIDATION" ? "Closes" : typ === "TEST" ? "Proves" : "Parent";
      const kv = [["Rank", rank || "—"], [parentNoun, t.parent ? nameOf(t.parent) : "none"]];
      if (t.milestone) kv.push(["Milestone", t.milestone]);
      if (deps.length) kv.push(["Depends", deps.map(nameOf).join(", ")]);
      if (t.start || t.due) kv.push(["Dates", (t.start || "—") + " → " + (t.due || "—")]);
      if (t.blocked_reason) kv.push(["Blocked", t.blocked_reason]);
      kv.push(["Body", req.length + " req · " + cases.length + " tests · " + acc.length + " accept"]);
      const notes = clipText(t.notes, 280);
      const reqLis = req.slice(0, 2).map((r) => `<li>${esc(clipText(r, 120))}</li>`).join("");
      return `<div class="gantt-tip-id">${esc(t.id)} · ${esc(typ)} · ${esc(t.status || "")}${t.priority ? " · " + esc(t.priority) : ""}</div>
        <div class="gantt-tip-ttl">${esc(t.title)}</div>
        <dl class="gantt-tip-kv">${kv.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
        ${notes ? `<p class="gantt-tip-notes">${esc(notes)}</p>` : ""}
        ${reqLis ? `<ul class="gantt-tip-req">${reqLis}</ul>` : ""}`;
    }
    function hideGanttTip() {
      const tip = $("gantt-tip");
      if (!tip) return;
      tip.hidden = true;
      tip.innerHTML = "";
      tip.className = "";
      tip.style.left = "";
      tip.style.top = "";
    }
    function placeGanttTip(e) {
      const tip = $("gantt-tip");
      if (!tip || tip.hidden) return;
      const pad = 12;
      const w = tip.offsetWidth, h = tip.offsetHeight;
      let x = e.clientX + 14, y = e.clientY + 16;
      if (x + w > innerWidth - pad) x = e.clientX - w - 10;
      if (y + h > innerHeight - pad) y = e.clientY - h - 10;
      if (x < pad) x = pad;
      if (y < pad) y = pad;
      tip.style.left = x + "px";
      tip.style.top = y + "px";
    }
    function showGanttTip(el, e) {
      const t = state.tasks.find((x) => x.id === el.dataset.id);
      const tip = $("gantt-tip");
      if (!t || !tip) return;
      tip.className = "tone-" + (t.type || "TASK");
      tip.innerHTML = ganttTipHTML(t, el.dataset.rank || "");
      tip.hidden = false;
      placeGanttTip(e);
    }

    const JSON_KEYS = ["id","uid","title","type","status","priority","milestone","parent","subtasks","assignees","tags","dependencies","requirements","test-cases","acceptance-criteria","definition-of-done","blocked_reason","created","updated","start","due","notes"];

    function slimTask(t) {
      const row = {};
      for (const k of JSON_KEYS) {
        const v = t[k];
        if (v == null || v === "") continue;
        if (Array.isArray(v) && !v.length) continue;
        row[k] = v;
      }
      return row;
    }

    function paintJSON(obj) {
      return esc(JSON.stringify(obj, null, 2)).replace(/^(\s*)(&quot;[^&]*&quot;)(:)/gm, '$1<span class="jk">$2</span>$3');
    }

    function packJSON() {
      return {
        project: state.project || {},
        rev,
        milestones: (state.milestones || []).map((m) => {
          const due = m.due ? " due " + m.due : "";
          return `${m.id} ${m.title}${due}`;
        }),
        tasks: visible().map(slimTask),
      };
    }

    function jsonlText() {
      return visible().map((t) => JSON.stringify(slimTask(t))).join("\n");
    }

    function jsonlFilename() {
      const id = String((state.project && state.project.id) || "docket");
      return id.replace(/[^a-zA-Z0-9._-]+/g, "-") + ".jsonl";
    }

    function jsonHTML() {
      const rows = visible();
      const { tasks, ...pack } = packJSON();
      const cards = rows.map((t) => `
        <button type="button" class="json-card tone-${esc(t.type || "TASK")} ${t.id === selected ? "on" : ""}" data-id="${t.id}">
          <pre>${paintJSON(slimTask(t))}</pre>
        </button>`).join("");
      return `<div class="json-wrap">
        <div class="json-legend"><span>jsonl fields · ${rows.length} cards</span>
          <span class="json-copies">
            <a class="json-link" href="#download-jsonl" data-download="jsonl" download>Download jsonl</a>
            <a class="json-link" href="#copy-jsonl" data-copy="jsonl">Copy jsonl to clipboard</a>
            <a class="json-link" href="#copy-json" data-copy="json">Copy JSON</a>
          </span>
        </div>
        <pre class="json-pack">${paintJSON(pack)}</pre>
        ${cards || '<div class="empty">No issues.</div>'}
      </div>`;
    }

    function bindList() {
      $("list").querySelectorAll(".row, .card, .dag-node, .gantt-row, .json-card, .qa-id").forEach((el) => {
        el.addEventListener("click", () => {
          if (el.dataset.id === selected) closeSheet();
          else selectTask(el.dataset.id);
        });
      });
      $("list").querySelectorAll(".gantt-row").forEach((el) => {
        el.addEventListener("mouseenter", (e) => showGanttTip(el, e));
        el.addEventListener("mousemove", placeGanttTip);
        el.addEventListener("mouseleave", hideGanttTip);
      });
      $("list").querySelectorAll("[data-add]").forEach((el) => {
        el.addEventListener("click", () => { addCol = el.dataset.add; render(); });
      });
      $("list").querySelectorAll(".composer").forEach((form) => {
        const input = form.querySelector("input");
        if (input) input.focus();
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const created = await send("POST", "/api/tasks", cardBody(form));
          addCol = "";
          selectTask(created.id);
          await load();
        });
      });
      $("list").querySelectorAll("[data-download]").forEach((el) => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          e.preventDefault();
          const blob = new Blob([jsonlText()], { type: "application/x-ndjson" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = jsonlFilename();
          a.click();
          URL.revokeObjectURL(url);
        });
      });
      $("list").querySelectorAll("[data-copy]").forEach((el) => {
        el.addEventListener("click", async (e) => {
          e.stopPropagation();
          e.preventDefault();
          const kind = el.dataset.copy;
          const blob = kind === "jsonl" ? jsonlText() : JSON.stringify(packJSON(), null, 2);
          const label = kind === "jsonl" ? "Copy jsonl to clipboard" : "Copy JSON";
          try {
            await navigator.clipboard.writeText(blob);
            el.textContent = "Copied";
            setTimeout(() => { el.textContent = label; }, 1200);
          } catch (_) {
            el.textContent = "Copy failed";
          }
        });
      });
      $("list").querySelectorAll(".card").forEach((el) => {
        el.addEventListener("dragstart", (e) => {
          e.dataTransfer.setData("text/plain", el.dataset.id);
          e.dataTransfer.effectAllowed = "move";
        });
      });
      $("list").querySelectorAll(".col").forEach((col) => {
        col.addEventListener("dragover", (e) => { e.preventDefault(); col.classList.add("over"); });
        col.addEventListener("dragleave", () => col.classList.remove("over"));
        col.addEventListener("drop", async (e) => {
          e.preventDefault();
          col.classList.remove("over");
          const id = e.dataTransfer.getData("text/plain");
          const status = col.dataset.status;
          const task = state.tasks.find((t) => t.id === id);
          if (!id || !task || task.status === status) return;
          await send("PATCH", "/api/tasks/" + encodeURIComponent(id), { status });
          await load();
        });
      });
    }

    function statusDot(id) {
      const fake = {
        all: { status: "To Do" },
        "To Do": { status: "To Do" },
        "In Progress": { status: "In Progress" },
        Done: { status: "Done" },
        Draft: { status: "Draft" },
        blocked: { status: "To Do", blocked_reason: "x" },
      }[id];
      return statusMark(fake || { status: "To Do" });
    }

    function formHTML(t) {
      const typ = t.type || "TASK";
      const parentNoun = typ === "GUARD" ? "Constrains" : typ === "VALIDATION" ? "Closes" : "Parent";
      const parentNeed = typ === "GUARD" || typ === "VALIDATION" || typ === "TEST";
      const parentEmpty = typ === "GUARD" ? "Choose the card this constrains" : typ === "VALIDATION" ? "Choose the card this closes" : typ === "TEST" ? "Choose the TASK this proves" : "No parent";
      const ms = (state.milestones || []).map((m) =>
        `<option value="${esc(m.id)}" ${m.id === t.milestone ? "selected" : ""}>${esc(m.title)}</option>`
      ).join("");
      return `
        <form class="issue" id="edit">
          <div class="issue-head">
            <div class="issue-id">${esc(t.id)}${t.uid ? `<div class="uid">${esc(t.uid)}</div>` : ""}</div>
            <button type="button" class="sheet-close" data-act="close" aria-label="Close" title="Close">×</button>
          </div>
          <textarea class="title-edit" name="title" rows="2" required>${esc(t.title)}</textarea>
          <div class="props">
            <label class="prop"><span>Type</span>
              <select name="type">${opt(typ, ["TASK","GOAL","PLAN","GUARD","TEST","VALIDATION"])}</select>
            </label>
            <label class="prop"><span>Status</span>
              <select name="status">${opt(t.status, ["To Do","In Progress","Done","Draft"])}</select>
            </label>
            <label class="prop"><span>Priority</span>
              <select name="priority">${opt(t.priority || "", ["","high","medium","low"])}</select>
            </label>
            <label class="prop"><span>${parentNoun}</span>
              <select name="parent" ${parentNeed ? "required" : ""}><option value="">${parentEmpty}</option>${parentOpts(t)}</select>
            </label>
            <label class="prop"><span>Milestone</span>
              <select name="milestone"><option value="">No milestone</option>${ms}</select>
            </label>
            <label class="prop"><span>Start</span>
              <input type="date" name="start" value="${esc(t.start || "")}">
            </label>
            <label class="prop"><span>Due</span>
              <input type="date" name="due" value="${esc(t.due || "")}">
            </label>
            <label class="prop"><span>Blocked</span>
              <input class="blocked-edit" name="blocked_reason" value="${esc(t.blocked_reason || "")}" placeholder="Add reason">
            </label>
          </div>
          <div class="field-label">User story / technical brief</div>
          <textarea class="notes" name="notes" placeholder="As a … I need … so that …  Or a technical contract: inputs, outputs, refuse. Not the title. Two sentences minimum." required>${esc(t.notes || "")}</textarea>
          <div class="field-label">Requirements</div>
          <textarea class="notes accept" name="requirements" placeholder="One requirement per line (at least two)" required>${esc((t.requirements || []).join("\n"))}</textarea>
          <div class="field-label">Test cases</div>
          <textarea class="notes accept" name="cases" placeholder="One test case per line (two if type TEST)" required>${esc((t["test-cases"] || []).join("\n"))}</textarea>
          <div class="field-label">Acceptance</div>
          <textarea class="notes accept" name="acceptance" placeholder="One criterion per line (at least two)" required>${esc((t["acceptance-criteria"] || []).join("\n"))}</textarea>
          <div id="err" class="err"></div>
          <div class="actions">
            <button type="button" class="ghost" data-act="complete">Mark as done</button>
            <button type="button" class="danger" data-act="archive">Archive</button>
          </div>
        </form>`;
    }

    function parentOpts(cur) {
      const typ = cur.type || "TASK";
      return state.tasks.filter((x) => {
        if (x.id === cur.id) return false;
        if ((typ === "GUARD" || typ === "VALIDATION") && !["GOAL", "PLAN", "TASK"].includes(x.type || "TASK")) return false;
        if (typ === "TEST" && (x.type || "TASK") !== "TASK") return false;
        return true;
      }).map((x) =>
        `<option value="${esc(x.id)}" ${x.id === cur.parent ? "selected" : ""}>${esc(x.id.replace("TASK-", "") + " " + x.title)}</option>`
      ).join("");
    }

    function opt(cur, vals) {
      const labels = { "": "No priority", high: "High", medium: "Medium", low: "Low", TASK: "TASK", GOAL: "GOAL", PLAN: "PLAN", GUARD: "GUARD", TEST: "TEST", VALIDATION: "VALIDATION" };
      return vals.map((v) => `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${labels[v] || v}</option>`).join("");
    }

    async function saveForm(form, id) {
      await send("PATCH", "/api/tasks/" + encodeURIComponent(id), cardBody(form));
      await load();
    }

    function lines(s) {
      return String(s || "").split("\n").map((x) => x.trim()).filter(Boolean);
    }

    function cardBody(form) {
      const fd = new FormData(form);
      const body = Object.fromEntries(fd.entries());
      body.requirements = lines(body.requirements);
      body["test-cases"] = lines(body.cases);
      body["acceptance-criteria"] = lines(body.acceptance);
      delete body.cases;
      delete body.acceptance;
      if (form.dataset.status && !body.status) body.status = form.dataset.status;
      return body;
    }

    function bindForm(t) {
      const form = $("edit");
      const err = $("err");
      const fail = (ex) => { err.textContent = String(ex.message || ex); };
      form.querySelectorAll("select, input[type=date]").forEach((el) => {
        el.addEventListener("change", () => saveForm(form, t.id).catch(fail));
      });
      form.querySelectorAll("textarea, .blocked-edit").forEach((el) => {
        el.addEventListener("blur", () => saveForm(form, t.id).catch(fail));
      });
      form.querySelectorAll("[data-act]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (btn.dataset.act === "close") {
            closeSheet();
            return;
          }
          try {
            await send("POST", "/api/tasks/" + encodeURIComponent(t.id) + "/" + btn.dataset.act, {});
            if (btn.dataset.act === "archive") selected = "";
            await load();
          } catch (ex) { fail(ex); }
        });
      });
    }

    $("new").addEventListener("click", () => {
      $("composer").classList.add("open");
      $("composer").querySelector("input").focus();
    });
    $("q").addEventListener("input", (e) => { query = e.target.value.trim().toLowerCase(); render(); });
    $("composer").addEventListener("submit", async (e) => {
      e.preventDefault();
      const created = await send("POST", "/api/tasks", cardBody(e.target));
      e.target.reset();
      $("composer").classList.remove("open");
      addCol = "";
      selectTask(created.id);
      await load();
    });
    $("view-list").addEventListener("click", () => setView("list"));
    $("view-board").addEventListener("click", () => setView("board"));
    $("view-dag").addEventListener("click", () => setView("dag"));
    $("view-gantt").addEventListener("click", () => setView("gantt"));
    $("view-qa").addEventListener("click", () => setView("qa"));
    $("view-json").addEventListener("click", () => setView("json"));
    $("dag-play").addEventListener("click", startDagPlay);
    let resizeFrame = 0;
    window.addEventListener("resize", () => {
      if (view !== "dag" && view !== "gantt" && view !== "board") return;
      if (resizeFrame) cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(() => { resizeFrame = 0; render(); });
    });
    $("list").addEventListener("scroll", hideGanttTip, { passive: true });
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      if ($("gantt-tip") && !$("gantt-tip").hidden) {
        hideGanttTip();
        return;
      }
      if (dagPlay.timer) {
        stopDagPlay();
        return;
      }
      if ($("composer").classList.contains("open")) {
        $("composer").classList.remove("open");
        return;
      }
      if (addCol) {
        addCol = "";
        render();
        return;
      }
      if (selected) closeSheet();
    });
    viewChrome();

    async function send(method, url, body) {
      const res = await fetch(url, {
        method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const text = await res.text();
      if (!res.ok) throw new Error(text || res.statusText);
      return text ? JSON.parse(text) : {};
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    load().then(() => { armPoll(); requestAnimationFrame(watch); }).catch((err) => { $("list").innerHTML = '<div class="err">' + esc(err) + "</div>"; });
  </script>
</body>
</html>
